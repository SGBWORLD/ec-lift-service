<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emirates Contracting — Lift Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2530">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EC Lift">
<style>
:root{
  --navy:#1C2530; --navy-2:#26313E; --steel:#4A7A96; --steel-l:#DCE6EA;
  --paper:#EFEDE6; --paper-2:#F7F6F2; --ink:#1A1E23; --ink-soft:#5B6470;
  --line:#CFCABE; --yellow:#F2B705; --yellow-d:#8A6600; --green:#2F7D52; --green-bg:#E4F1E9;
  --red:#B23A2E; --red-bg:#F8E6E3; --amber-bg:#FCEFD4;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--paper-2);box-shadow:0 0 0 1px var(--line);}

/* Top bar */
.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border:2px solid var(--yellow);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--yellow);flex-shrink:0;}
.brand-text .name{font-weight:600;font-size:15px;line-height:1.2;}
.brand-text .sub{font-size:11px;color:#9FB0BC;letter-spacing:.02em;}
.sync-pill{font-size:11px;color:#9FB0BC;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

/* Nav */
.nav{display:flex;border-bottom:1px solid var(--line);background:var(--paper-2);overflow-x:auto;}
.nav button{flex:0 0 auto;padding:12px 18px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.nav button.active{color:var(--navy);border-bottom-color:var(--yellow);}
.nav button:hover{color:var(--navy);}

.view{padding:20px;}
.hidden{display:none !important;}

/* Section headers */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.section-head h1{font-size:19px;font-weight:600;margin:0;color:var(--navy);}
.section-head .count{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

/* Buttons */
button.btn{font-family:inherit;font-size:13px;font-weight:500;padding:9px 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;}
button.btn:hover{background:#0F161D;}
button.btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--line);}
button.btn.secondary:hover{background:#fff;border-color:var(--navy);}
button.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-bg);}
button.btn.danger:hover{background:var(--red-bg);}
button.btn.full{width:100%;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Cards / list rows */
.row-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .1s;}
.row-card:hover{border-color:var(--steel);}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.row-title{font-weight:600;font-size:14px;color:var(--navy);}
.row-id{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:2px;}
.row-meta{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.empty{padding:36px 16px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);}
.empty .big{font-size:14px;color:var(--navy);font-weight:500;margin-bottom:4px;}

/* Badges */
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;}
.badge.active,.badge.completed,.badge.reportgenerated,.badge.customeracknowledged{background:var(--green-bg);color:var(--green);}
.badge.pending,.badge.open,.badge.progress,.badge.inprogress{background:var(--amber-bg);color:var(--yellow-d);}
.badge.inactive,.badge.overdue,.badge.nonactive{background:var(--red-bg);color:var(--red);}
.badge.underrenewalgraceperiod{background:var(--amber-bg);color:var(--yellow-d);}

/* Forms */
label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin:12px 0 5px;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:70px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.field-err{color:var(--red);font-size:11px;margin-top:4px;}

/* Panel / card block */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.panel h2{font-size:14px;font-weight:600;margin:0 0 4px;color:var(--navy);}
.panel .desc{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}

/* Job detail tabs */
.subnav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.subnav button{font-family:inherit;font-size:12px;font-weight:500;padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);cursor:pointer;}
.subnav button.active{color:var(--navy);border-bottom-color:var(--steel);}

/* Checklist */
.check-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:800px){.check-cols{grid-template-columns:1fr;}}
.check-col h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);border-bottom:1px solid var(--steel-l);padding-bottom:6px;margin:0 0 8px;}
.check-item{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;border-bottom:1px solid #F0EEE7;}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);flex-shrink:0;}
.check-item-row{padding:9px 0;border-bottom:1px solid #F0EEE7;}
.check-item-row.incomplete{background:var(--red-bg);margin:0 -8px;padding:9px 8px;border-radius:6px;}
.check-item-label{font-size:12.5px;margin-bottom:6px;color:var(--ink);}
.chip-row.small .chip{padding:5px 11px;font-size:11px;}
.chip.ok.on{background:var(--green);border-color:var(--green);}
.chip.attn.on{background:var(--red);border-color:var(--red);}
.checklist-attn-block{margin-top:8px;padding:10px;background:var(--paper-2);border-radius:8px;}
.checklist-attn-block textarea{width:100%;min-height:50px;font-size:12px;}
.check-progress{font-size:12px;color:var(--ink-soft);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;}

/* Photos */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px;}
.photo-tile{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.photo-tile img{width:100%;height:90px;object-fit:cover;display:block;}
.photo-tile .cap{font-size:10px;padding:5px 7px;color:var(--ink-soft);}
.photo-tile .rm{position:absolute;top:4px;right:4px;background:rgba(28,37,48,.75);color:#fff;border:none;border-radius:4px;width:20px;height:20px;font-size:12px;cursor:pointer;}
.upload-box{border:1.5px dashed var(--line);border-radius:8px;padding:20px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:12px;}
.upload-box:hover{border-color:var(--steel);color:var(--steel);}

/* Signature */
.sig-pad-wrap{border:1px solid var(--line);border-radius:8px;background:#fff;}
canvas.sig-pad{width:100%;height:150px;display:block;touch-action:none;cursor:crosshair;}
.sig-actions{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line);}
.sig-actions span{font-size:11px;color:var(--ink-soft);}
.sig-saved{display:flex;align-items:center;gap:10px;padding:10px;background:var(--green-bg);border-radius:8px;font-size:12px;color:var(--green);}
.sig-saved img{height:50px;background:#fff;border-radius:4px;}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:99;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Type toggle chips */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:var(--ink-soft);}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}

.footer-note{font-size:11px;color:var(--ink-soft);text-align:center;padding:16px;border-top:1px solid var(--line);}
.legend{font-size:11px;color:var(--ink-soft);background:var(--amber-bg);border-radius:8px;padding:8px 12px;margin-bottom:14px;}

/* Role toggle */
.role-toggle{display:flex;background:#0F161D;border-radius:20px;padding:2px;flex-shrink:0;}
.role-toggle button{font-family:inherit;font-size:11px;font-weight:500;padding:6px 12px;border-radius:18px;border:none;background:none;color:#9FB0BC;cursor:pointer;}
.role-toggle button.on{background:var(--yellow);color:#1C2530;}

/* Login screen */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(28,37,48,.08);}
.login-card .brand-mark{width:44px;height:44px;font-size:16px;margin:0 auto 14px;border:2px solid var(--yellow);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy);}
.login-card h1{font-size:16px;text-align:center;margin:0 0 4px;color:var(--navy);}
.login-card .sub{font-size:12px;text-align:center;color:var(--ink-soft);margin-bottom:20px;}
.login-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;margin-bottom:4px;}
.login-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);cursor:pointer;font-size:13px;color:var(--ink);}
.login-item:hover{border-color:var(--steel);}
.login-item .tag{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
.login-item.office{border-color:var(--navy);background:#fff;font-weight:500;}
.login-add{font-size:12px;color:var(--steel);text-align:center;margin-top:12px;cursor:pointer;text-decoration:underline;}
.login-pin-box{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}

/* Current user pill */
.user-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:#fff;}
.user-pill button{font-family:inherit;font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid #3A4652;background:none;color:#9FB0BC;cursor:pointer;}
.user-pill button:hover{border-color:#fff;color:#fff;}

/* Modal (QR display) */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,22,29,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-card{background:#fff;border-radius:12px;padding:22px;max-width:320px;width:100%;text-align:center;}
.modal-card h3{margin:0 0 4px;font-size:15px;color:var(--navy);}
.modal-card .sub{font-size:11px;color:var(--ink-soft);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;}
.qr-box{display:flex;justify-content:center;margin:10px 0 16px;}
.modal-card .actions{display:flex;gap:8px;}
.modal-card .actions button{flex:1;}

/* Scanner */
.scan-wrap{background:#000;border-radius:12px;overflow:hidden;position:relative;max-width:420px;margin:0 auto;}
.scan-wrap video{width:100%;display:block;}
.scan-frame{position:absolute;inset:15%;border:2px solid var(--yellow);border-radius:12px;pointer-events:none;}
.scan-status{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;}
.scan-hit{background:var(--green-bg);color:var(--green);padding:10px 14px;border-radius:8px;font-size:13px;text-align:center;margin-top:12px;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
.stat-card .num{font-size:22px;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.stat-card .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-row input{flex:1;min-width:160px;}
.search-row select{width:auto;}
.cust-contract-box{margin-top:10px;padding:10px 12px;background:var(--paper-2);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;}
.cust-contract-box .k{display:block;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.cust-contract-box .v{display:block;font-size:12.5px;color:var(--ink);}
.lift-chip-row{font-size:12px;padding:6px 0;border-bottom:1px solid #F0EEE7;color:var(--ink);}
@media (max-width:560px){ .cust-contract-box{grid-template-columns:1fr;} }
.send-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.send-row button{flex:1;min-width:140px;}
</style>
</head>
<body>
<div id="login-screen"></div>
<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">EC</div>
      <div class="brand-text">
        <div class="name">Emirates Contracting</div>
        <div class="sub">Lift service &amp; maintenance</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="role-toggle hidden" id="roleToggle">
        <button id="role-tech" class="on" onclick="setRole('tech')">Technician</button>
        <button id="role-office" onclick="setRole('office')">Back office</button>
      </div>
      <div class="user-pill hidden" id="userPill">
        <span id="userPillLabel"></span>
        <button onclick="switchUser()">Switch</button>
      </div>
      <div class="sync-pill"><span class="sync-dot"></span><span id="syncLabel">Synced</span></div>
    </div>
  </div>
  <div class="nav" id="mainNav">
    <button data-view="scan" class="active">Scan QR</button>
    <button data-view="jobdue">Job Due</button>
    <button data-view="lifts">Lifts</button>
    <button data-view="jobs">Jobs</button>
    <button data-view="newjob">New job</button>
    <button data-view="customers">Customers</button>
    <button data-view="dashboard">Dashboard</button>
  </div>
  <div id="noCloudBanner" class="hidden" style="background:var(--amber-bg);color:var(--yellow-d);font-size:12px;padding:8px 16px;text-align:center;">Cloud sync isn't connected yet — changes stay on this device only. See setup instructions.</div>

  <div class="view" id="view-scan"></div>
  <div class="view hidden" id="view-lifts"></div>
  <div class="view hidden" id="view-jobs"></div>
  <div class="view hidden" id="view-newjob"></div>
  <div class="view hidden" id="view-jobdetail"></div>
  <div class="view hidden" id="view-dashboard"></div>
  <div class="view hidden" id="view-customers"></div>
  <div class="view hidden" id="view-jobdue"></div>
  <div class="view hidden" id="modal-root"></div>

  <div class="footer-note">Data is stored for this app link and shared across everyone using it — no account, no cost.</div>
</div>
<div id="toast"></div>

<script>
/* ---------- state ---------- */
let DB = { lifts: [], jobs: [], counters: { lift: 5, job: 2, report: 2 } };
let currentJobId = null;
let currentDetailTab = 'checklist';
let sigPadTech = null, sigPadCust = null;

const CHECKLIST_SECTIONS = {
  'Machine room': ['Main switches','Motor oil level','Motor terminal tightness','Motor feed back sensor','Main rope / OSG rope','Divertors','Brake operation / brake liner','Controller cleaning','Controller wire tightness','Relay / contactor operation','Controller','M/c room earthing','OSG operation','Clean machine','M/c room light/fan/ventilation','M/c room door lock'],
  'General & car': ['Emergency alarm','Emergency light','Intercom','Car calls','Other COP functions','Car indicator','Play in car','Car stopping & leveling','Ride comfort','Door operation/delocking key','Safety edge/IRL safety','Landing push box/buttons','Landing indicator','Car and landing sill','Car light','Car fan'],
  'Car top & pit': ['Car top safety','Inspection box/hand lamp','Guide rail lubrication','Door lubrication','Door operation function','Door operation belt/chain','Landing/car door track roller','Landing/car door lock','Landing/door smoothness','Clean car top','Guide shoe-car/cwt','Car top/car bottom isolation','H.v/car top wire tightness','Pit cleaning','Tension wl/safety gear','Buffer/cwt']
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

/* ---------- Google Sheets sync (live Excel-style record) ----------
   Paste your Apps Script Web App URL below once deployed (see README).
   Until filled in, this feature is simply skipped — everything else keeps working. */
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwTzx1nAu4GC2AbYwpMACbuQvdFv1CLs8cSq9Fq7T_HgTgB42On_jyu5JQ61tcKc9xs/exec";
function syncMetaToSheet(){
  if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf('YOUR_') === 0) return;
  try{
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({
        kind: 'meta',
        customers: DB.customers.map(c=>({
          id:c.id, name:c.name, type:c.type, contactPerson:c.contactPerson, phone:c.phone, whatsapp:c.whatsapp,
          email:c.email, address:c.address, status:c.status, contractId:c.contractId,
          contractStart:c.contractStart, contractEnd:c.contractEnd, maintenanceFrequency:c.maintenanceFrequency,
          serviceWindowStart:c.serviceWindowStart, serviceWindowEnd:c.serviceWindowEnd,
          overdue: isOverdue(c) ? 'Yes' : 'No', nextServiceDue:c.nextServiceDue
        })),
        sites: DB.sites.map(s=>({id:s.id, customerId:s.customerId, customerName:custName(s.customerId), name:s.name, address:s.address, status:s.status})),
        lifts: DB.lifts.map(l=>({id:l.id, customerId:l.customerId, customerName:custName(l.customerId), siteId:l.siteId, siteName:siteName(l.siteId), status:l.status})),
        technicians: DB.technicians.map(t=>({name:t.name, hasPin: t.pin ? 'Yes' : 'No'}))
      })
    }).catch(()=>{});
  }catch(e){ /* best-effort */ }
}
function syncToSheet(job){
  if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf('YOUR_') === 0) return;
  let answered=0, total=0, attention=0;
  Object.values(job.checklist||{}).forEach(arr=>{
    total += arr.length;
    arr.forEach(it=>{ if(it.status) answered++; if(it.status==='Attention') attention++; });
  });
  try{
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({
        kind: 'job',
        jobId: job.jobId, jobCardNo: job.jobCardNo, liftId: job.liftId,
        customerName: job.customerName, address: job.address, technician: job.technician,
        date: job.date, status: job.status, priority: job.priority, timeIn: job.timeIn, timeOut: job.timeOut,
        type: job.type, breakdownReason: job.breakdownReason, rectification: job.rectification,
        notes: job.notes, finalStatus: job.finalStatus, whatsappStatus: job.whatsappStatus,
        charge: job.charge, paymentMethod: job.paymentMethod,
        checklistProgress: answered+'/'+total, attentionItems: attention,
        parts: (job.parts||[]).map(p=>(p.no||'')+' '+(p.desc||'')+' x'+(p.qty||'1')).join('; '),
        partsList: (job.parts||[]).map(p=>({no:p.no||'', desc:p.desc||'', qty:p.qty||'1', hasPhoto: p.photoId ? 'Yes' : 'No'}))
      })
    }).catch(()=>{});

function initCloudSync(){
  fbDb.collection('app').doc('meta').onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      DB.lifts = d.lifts || [];
      DB.customers = d.customers || [];
      DB.sites = d.sites || [];
      DB.technicians = d.technicians && d.technicians.length ? d.technicians : [{name:'Ali', pin:''}, {name:'Ahmed', pin:''}];
      DB.officePin = d.officePin || '';
      DB.allowManualLiftOpen = d.allowManualLiftOpen !== false;
      DB.counters = d.counters || {lift:5, job:2, report:2, customer:0, site:0};
    } else {
      seedDB();
      saveDB();
    }
    document.getElementById('syncLabel').textContent = 'Synced';
    softRerender();
  }, ()=>{ document.getElementById('syncLabel').textContent = 'Sync error'; });

  fbDb.collection('jobs').onSnapshot(snap=>{
    const jobs = snap.docs.map(d=>{
      const data = d.data();
      const existing = DB.jobs.find(j=>j.jobId===d.id);
      // keep any already-fetched photos cached locally, since job docs no longer store photos
      return Object.assign(mkJob({}), data, { status: normalizeStatus(data.status), checklist: normalizeChecklist(data.checklist), photos: (existing && existing.photos) || [] });
    });
    DB.jobs = jobs;
    softRerender();
  }, ()=>{ document.getElementById('syncLabel').textContent = 'Sync error'; });

function mkJob(overrides){
  const checklist = {};
  Object.entries(CHECKLIST_SECTIONS).forEach(([sec, items])=>{ checklist[sec] = items.map(()=>({status:'', issue:'', photoId:''})); });
  return Object.assign({
    jobId:'', jobCardNo:'', liftId:'', customerId:'', siteId:'', date:'', technician:'', status:'Open',
    customerName:'', customerPhone:'', customerEmail:'', callAttendedBy:'', address:'', timeIn:'', timeOut:'',

    notes:'', charge:'', paymentMethod:'Cash',
    priority:'Medium', finalStatus:'', whatsappStatus:'Pending', parts:[], reportUrl:'',
    checklist, photos:[], sig:{tech:null, techName:'', cust:null, custName:''}
  }, overrides);
}
const STATUS_STAGES = ['Open','In Progress','Completed','Report Generated','Customer Acknowledged'];
function normalizeStatus(s){
  if(s==='Pending') return 'Open';
  if(s==='In progress') return 'In Progress';
  return STATUS_STAGES.includes(s) ? s : 'Open';
}
function normalizeChecklist(checklist){
  const out = {};
  Object.entries(CHECKLIST_SECTIONS).forEach(([sec, items])=>{
    const arr = (checklist && checklist[sec]) || [];
    out[sec] = items.map((_,idx)=>{
      const v = arr[idx];
      if(v && typeof v === 'object') return {status:v.status||'', issue:v.issue||'', photoId:v.photoId||''};
      if(v === true) return {status:'OK', issue:'', photoId:''};
      return {status:'', issue:'', photoId:''};
    });
  });
  return out;
}

function isOverdue(c){
  if(!c.serviceWindowEnd) return false;
  const end = new Date(c.serviceWindowEnd);
  const today = new Date();
  today.setHours(0,0,0,0);
  return end < today;
}
function nextServiceDueApprox(c){
  if(c.nextServiceDue) return new Date(c.nextServiceDue);
  if(!c.serviceWindowStart) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.serviceWindowStart);
  if(isNaN(d.getTime())) return null;
  const freq = c.maintenanceFrequency || 'Monthly';
  let guard = 0;
  if(freq==='Weekly'){
    while(d < today && guard < 520){ d.setDate(d.getDate()+7); guard++; }
  } else {
    const step = freq==='Quarterly' ? 3 : 1;
    while(d < today && guard < 120){ d.setMonth(d.getMonth()+step); guard++; }
  }
  return d;
}
function daysUntil(date){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}

async function startScanner(){
  TECH_NAME = document.getElementById('scanTechName').value.trim();
  const status = document.getElementById('scanStatus');
  document.getElementById('scanWrapBox').style.display = 'block';
  document.getElementById('scanStartBox').style.display = 'none';
  if(typeof jsQR !== 'function'){
    status.innerHTML = `<div class="field-err">Scanner library did not load (no internet, or it's blocked on this network). Use "pick a lift manually" below instead.</div>`;
    document.getElementById('scanWrapBox').style.display = 'none';
    document.getElementById('scanStartBox').style.display = 'block';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    status.innerHTML = `<div class="field-err">Could not access the camera. Check permissions, or use "pick a lift manually" below.</div>`;
    document.getElementById('scanWrapBox').style.display = 'none';
    document.getElementById('scanStartBox').style.display = 'block';
    return;
  }
  const video = document.getElementById('scanVideo');
  video.srcObject = scanStream;
  video.setAttribute('playsinline', true);
  try{
    await video.play();
  }catch(e){
    status.innerHTML = `<div class="field-err">Camera opened but could not start the video feed (${esc(e.message||e.name||'unknown error')}). Try again, or use "pick a lift manually" below.</div>`;
    return;
  }
  status.textContent = 'Starting camera…';
  let frames = 0, lastDbgUpdate = 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function tick(){
    if(!scanStream) return;
    try{
      if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0){
        frames++;
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
        if(code && code.data){
          let liftId = null;
          if(code.data.startsWith('ECLIFT:')){
            liftId = code.data.slice(7).trim();
          } else {
            const m = code.data.match(/Lift\s*ID\s*[:\-]\s*([^\s|\n]+)/i);
            if(m) liftId = m[1].trim();
          }
          if(liftId){
            handleScanHit(liftId);
            return;
          } else {
            status.textContent = 'Saw a QR code, but could not read a lift ID from it. Frame ' + video.videoWidth + '×' + video.videoHeight + ', frames scanned: ' + frames;
          }
        } else if(Date.now() - lastDbgUpdate > 1000){
          lastDbgUpdate = Date.now();
          status.textContent = 'Point the camera at the lift QR code. (camera ' + video.videoWidth + '×' + video.videoHeight + ', frames scanned: ' + frames + ')';
        }
      } else if(Date.now() - lastDbgUpdate > 1000){
        lastDbgUpdate = Date.now();
        status.textContent = 'Waiting for camera feed… (readyState: ' + video.readyState + ')';
      }
    }catch(e){
      if(Date.now() - lastDbgUpdate > 1000){
        lastDbgUpdate = Date.now();
        status.textContent = 'Scan error: ' + (e.message || e.name || 'unknown') + ' — still trying…';
      }
    }
    scanRAF = requestAnimationFrame(tick);
  }
  scanRAF = requestAnimationFrame(tick);
}
function stopScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  }catch(e){ /* audio not available — ignore */ }
}
function handleScanHit(liftId){
  stopScanner();
  const status = document.getElementById('scanStatus');
  const lift = DB.lifts.find(l=>l.id===liftId);
  if(!lift){
    if(status) status.innerHTML = `<div class="field-err">Scanned code "${esc(liftId)}" does not match a known lift.</div>`;
    return;
  }
  playBeep();
  if(status) status.innerHTML = `<div class="scan-hit">Matched ${esc(liftId)} — opening job…</div>`;
  setTimeout(()=> goToLiftJob(liftId), 400);
}
function manualPickGo(){
  const liftId = document.getElementById('manualLiftPick').value;
  if(!liftId){ toast('Select a lift first'); return; }
  goToLiftJob(liftId);
}
function goToLiftJob(liftId){
  const liftForAssignment = DB.lifts.find(l=>l.id===liftId);
  if(liftForAssignment){
    const c = DB.customers.find(x=>x.id===liftForAssignment.customerId);
    if(c && c.assignedTechnician){ c.assignedTechnician = ''; }
  }
  const existing = DB.jobs.find(j=>j.liftId===liftId && ['Open','In Progress'].includes(j.status));
  if(existing){
    existing.technician = existing.technician || TECH_NAME;
    const lift = DB.lifts.find(l=>l.id===liftId);
    if(lift && !existing.customerName){
      existing.customerId = lift.customerId;
      existing.siteId = lift.siteId;
      existing.customerName = custName(lift.customerId);
      existing.address = siteAddress(lift.siteId);
    }
    saveDB(existing); openJob(existing.jobId); return;
  }
  const lift = DB.lifts.find(l=>l.id===liftId);
  DB.counters.job += 1;
  const jobId = 'JOB-' + String(DB.counters.job).padStart(3,'0');
  const jobCardNo = 'JC-' + String(DB.counters.job).padStart(3,'0');
  const job = mkJob({
    jobId, jobCardNo, liftId, date: new Date().toISOString().slice(0,10), technician: TECH_NAME, status:'Open', timeIn: new Date().toTimeString().slice(0,5),
    customerId: lift ? lift.customerId : '', siteId: lift ? lift.siteId : '',
    customerName: lift ? custName(lift.customerId) : '', address: lift ? siteAddress(lift.siteId) : ''
  });
  DB.jobs.push(job);
  saveDB(job);
  toast('Job ' + jobId + ' started at ' + liftId);
  openJob(jobId);
}

function durationText(timeIn, timeOut){
  if(!timeIn || !timeOut) return '';
  const [h1,m1] = timeIn.split(':').map(Number);
  const [h2,m2] = timeOut.split(':').map(Number);
  if(isNaN(h1)||isNaN(m1)||isNaN(h2)||isNaN(m2)) return '';
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins < 0) mins += 24*60;
  return Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
}

function attachPartPhoto(idx, e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = async function(){
      const canvas = document.createElement('canvas');
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const j = getJob();
      const p = j.parts[idx];
      const photo = {id:'PH-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), data:dataUrl, caption:'Part: '+(p.no||p.desc||'')};
      if(FB_READY){
        try{
          await fbDb.collection('jobs').doc(j.jobId).collection('photos').doc(photo.id).set(photo);
          j.photos.push(photo);
        }catch(err){ toast('Could not upload photo. Check connection and try again.'); return; }
      }else{
        j.photos.push(photo);
      }
      p.photoId = photo.id;
      syncPhotoToSheet(j.jobId, photo);
      saveDB();
      renderPartsList(j);
      toast('Photo attached');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function saveChecklistIssue(sec, idx, text){
  const j = getJob();
  j.checklist[sec][idx].issue = text.trim();
  saveDB();
}
function attachChecklistPhoto(sec, idx, e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = async function(){
      const canvas = document.createElement('canvas');
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const j = getJob();
      const label = CHECKLIST_SECTIONS[sec][idx];
      const photo = {id:'PH-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), data:dataUrl, caption:'Attention: '+label, checklistRef: sec+'|'+idx};
      if(FB_READY){
        try{
          await fbDb.collection('jobs').doc(j.jobId).collection('photos').doc(photo.id).set(photo);
          j.photos.push(photo);
        }catch(err){ toast('Could not upload photo. Check connection and try again.'); return; }
      }else{
        j.photos.push(photo);
      }
      j.checklist[sec][idx].photoId = photo.id;
      syncPhotoToSheet(j.jobId, photo);
      saveDB();
      renderChecklistTab(j, document.getElementById('detail-body'));
      toast('Photo attached');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function validateChecklist(j){
  let total=0, answered=0, attnIncomplete=0;
  Object.values(j.checklist).forEach(arr=>{
    total+=arr.length;
    arr.forEach(it=>{
      if(it.status) answered++;
      if(it.status==='Attention' && (!it.issue || !it.photoId)) attnIncomplete++;
    });
  });
  return { total, answered, attnIncomplete, complete: answered===total && attnIncomplete===0 };
}

}
async function removePhoto(idx){

}

function initPad(which){
  const canvas = document.getElementById('pad-'+which);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.scale(2,2); ctx.strokeStyle = '#1A1E23'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  }
  resize();
  let drawing=false, last=null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX-rect.left, y: t.clientY-rect.top };
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  if(which==='tech') sigPadTech = canvas; else sigPadCust = canvas;
}
function clearPad(which){
  const canvas = document.getElementById('pad-'+which);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function saveSig(which){
  const canvas = document.getElementById('pad-'+which);
  const nameEl = document.getElementById(which+'-sig-name');
  const j = getJob();
  const name = nameEl.value.trim();
  if(!name){ nameEl.style.borderColor='var(--red)'; toast('Enter a name before saving the signature'); return; }
  const dataUrl = canvas.toDataURL('image/png');
  if(which==='tech'){ j.sig.tech = dataUrl; j.sig.techName = name; }
  else { j.sig.cust = dataUrl; j.sig.custName = name; }
  saveDB();
  renderDetailTab();
  toast('Signature saved');
}
function clearSavedSig(which){
  const j = getJob();
  if(which==='tech') j.sig.tech = null; else j.sig.cust = null;
  saveDB();
  renderDetailTab();
}

/* -- report tab -- */
function renderReportTab(j, body){
  const v = validateChecklist(j);
  const hasContact = j.customerPhone || j.customerEmail;
  const stageLabel = { 'Open':'Job is open', 'In Progress':'Job is in progress', 'Completed':'Job marked completed', 'Report Generated':'Report generated', 'Customer Acknowledged':'Customer acknowledged — job closed' }[j.status] || j.status;

  let actionsHtml = '';
  if(j.status==='Open'){
    actionsHtml = `
      <div class="desc">Starting the service records the time in and moves this job to "In Progress" on the office Dashboard.</div>
      <button class="btn full" onclick="startService()">Start service</button>`;
  } else if(j.status==='In Progress'){
    const blockers = [];
    if(v.answered < v.total) blockers.push((v.total-v.answered) + ' checklist item(s) not yet answered');
    if(v.attnIncomplete) blockers.push(v.attnIncomplete + ' attention item(s) missing a photo or description');
    if(!j.sig.tech || !j.sig.cust) blockers.push('signatures not yet collected');
    actionsHtml = `
      <div class="desc">Finish the checklist, photos, and signatures, then mark the job completed to unlock the report step.</div>
      ${blockers.length ? `<div class="field-err" style="margin-bottom:10px;">Not ready yet: ${blockers.join(', ')}.</div>` : ''}
      <button class="btn full" onclick="markJobCompleted()">Mark job completed</button>`;
  } else if(j.status==='Completed'){
    actionsHtml = `
      <div class="desc">Builds a branded PDF from this job's details, checklist, photos, and signatures — matching the Emirates Contracting service report format.</div>
      ${!hasContact ? '<div class="field-err" style="margin-bottom:10px;">Add a customer phone or email on the Details tab to enable send options.</div>' : ''}
      <button class="btn full" onclick="generateReport()">Generate report</button>`;
  } else {
    // Report Generated or Customer Acknowledged
    actionsHtml = `
      <div class="desc">Report already generated. Send it, then confirm once it's actually delivered.</div>
      <div class="send-row">
        <button class="btn secondary" onclick="downloadPDF()"><i class="ti ti-download"></i> Download PDF again</button>
        <button class="btn secondary" ${j.customerPhone?'':'disabled'} onclick="sendWhatsApp()">Send WhatsApp message</button>
        <button class="btn secondary" ${j.customerEmail?'':'disabled'} onclick="sendEmail()">Open email draft</button>
      </div>
      <button class="btn ${j.whatsappStatus==='Sent'?'secondary':''} full" style="margin-top:10px;" onclick="markWhatsAppSent()" ${j.whatsappStatus==='Sent'?'disabled':''}>${j.whatsappStatus==='Sent' ? '✓ Marked as sent' : 'Mark WhatsApp sent'}</button>
      ${j.status==='Customer Acknowledged' ? '<div class="scan-hit" style="margin-top:10px;">Customer has acknowledged this report. Job closed.</div>' : ''}`;
  }

  body.innerHTML = `
    <div class="panel">
      <h2>Complete &amp; send report</h2>
      <div class="legend">${stageLabel} · Checklist: ${v.answered}/${v.total} answered · Photos: ${j.photos.length} attached · Signatures: ${(j.sig.tech?1:0)+(j.sig.cust?1:0)}/2 collected · WhatsApp: ${esc(j.whatsappStatus||'Pending')}${['Report Generated','Customer Acknowledged'].includes(j.status) ? ' · Report link: '+(j.reportUrl?'ready':'uploading…') : ''}</div>
      ${actionsHtml}
      <div id="sendNote" class="scan-status" style="margin-top:10px;"></div>
    </div>
    <div class="panel">
      <h2>To back office</h2>
      <div class="desc">${j.status==='Report Generated' ? 'Once the customer confirms they\'ve received the report, Back Office marks this job "Customer Acknowledged" from the Dashboard to close it.' : 'Every job already appears on the Back office Dashboard the moment it changes here — no separate step needed, since the whole team shares this app\'s data.'}</div>
    </div>
  `;
}
function startService(){
  const j = getJob();
  j.status = 'In Progress';
  j.timeIn = new Date().toTimeString().slice(0,5);
  saveDB();
  toast('Service started');
  renderJobDetail();
}
function markJobCompleted(){
  const j = getJob();
  const v = validateChecklist(j);
  if(v.answered < v.total){
    toast('Answer every checklist item before completing the job (' + (v.total-v.answered) + ' left)');
    return;
  }
  if(v.attnIncomplete){
    toast(v.attnIncomplete + ' attention item(s) still need a photo and description');
    return;
  }
  if(!j.sig.tech || !j.sig.cust){
    toast('Collect both signatures before completing the job');
    return;
  }
  j.status = 'Completed';
  j.timeOut = new Date().toTimeString().slice(0,5);
  saveDB();
  toast('Job marked completed');
  renderJobDetail();
}
async function generateReport(){
  const j = getJob();
  const doc = buildPDFDoc(j);
  j.status = 'Report Generated';
  uploadReportToDrive(j, doc); // fire-and-forget; fills j.reportUrl for the WhatsApp message once ready
  saveDB();
  const filename = (j.jobId||'service-report') + '.pdf';
  const note = document.getElementById('sendNote');
  try{
    const blob = doc.output('blob');
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Service report '+j.jobId, text:'Service report for '+(j.customerName||'customer')+' — '+j.liftId });
      renderJobDetail();
      return;
    }
  }catch(e){ /* user cancelled share or unsupported — fall through to download */ }
  doc.save(filename);
  renderJobDetail();
}
async function uploadReportToDrive(job, doc){
  if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf('YOUR_') === 0) return;
  try{
    const dataUrl = doc.output('datauristring');
    const res = await fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({ kind:'report', jobId: job.jobId, dataUrl })
    });
    const data = await res.json();
    if(data && data.ok && data.url){
      const j = DB.jobs.find(x=>x.jobId===job.jobId);
      if(j){ j.reportUrl = data.url; saveDB(j); if(document.getElementById('detail-body')) renderJobDetail(); }
    }
  }catch(e){ /* best-effort — WhatsApp message just won't include a link this time */ }
}
function downloadPDF(){
  const j = getJob();
  const doc = buildPDFDoc(j);
  doc.save((j.jobId||'service-report') + '.pdf');
  toast('PDF downloaded');
}
function sendWhatsApp(){
  const j = getJob();
  const digits = (j.customerPhone||'').replace(/[^0-9]/g,'');
  if(!digits){ toast('Add a customer phone number first'); return; }
  const msg = j.reportUrl
    ? `Dear ${j.customerName||'Customer'}, Your EC Lift Service Report is ready. Job No: ${j.jobId} | Lift ID: ${j.liftId} | Date: ${fmtDate(j.date)} | View Report: ${j.reportUrl}`
    : `Dear ${j.customerName||'Customer'}, Your EC Lift Service Report is ready. Job No: ${j.jobId} | Lift: ${j.liftId} | Date: ${fmtDate(j.date)} — PDF attached below. Emirates Contracting.`;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, '_blank');
}
function markWhatsAppSent(){
  const j = getJob();
  j.whatsappStatus = 'Sent';
  saveDB();
  toast('Marked as sent');
  renderJobDetail();
}
function sendEmail(){
  const j = getJob();
  if(!j.customerEmail){ toast('Add a customer email first'); return; }
  const subject = `Service report — ${j.liftId} — ${j.jobId}`;
  const bodyText = `Hello ${j.customerName||''},\n\nYour lift service report for ${j.liftId} (job ${j.jobId}, ${fmtDate(j.date)}) is complete. Please find the attached PDF.\n\nEmirates Contracting`;
  window.location.href = `mailto:${encodeURIComponent(j.customerEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;

function buildPDFDoc(j){
  const lift = DB.lifts.find(l=>l.id===j.liftId) || {location:''};
  const cust = DB.customers.find(c=>c.id===j.customerId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pw = doc.internal.pageSize.getWidth();
  const margin = 40; let y = 40;
  const MAROON = [139,30,45], LGREY = [242,242,242], BORDER = [210,206,200];

  function checkPage(needed){
    if(y + needed > 800){ doc.addPage(); y = 40; }
  }
  function sectionBar(title){
    checkPage(30);
    doc.setFillColor(...MAROON); doc.rect(margin, y, pw-2*margin, 18, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(title, margin+8, y+12.5);
    y += 18;
  }
  function fitOneLine(text, maxW){
    let s = String(text||'—');
    if(doc.getTextWidth(s) <= maxW) return s;
    while(s.length > 1 && doc.getTextWidth(s+'…') > maxW){ s = s.slice(0,-1); }
    return s + '…';
  }
  function fieldGrid(rows){
    const rowH = 20, labelW = 108;
    const valW = (pw-2*margin-2*labelW)/2;
    rows.forEach(([l1,v1,l2,v2])=>{
      checkPage(rowH);
      doc.setDrawColor(...BORDER);
      doc.setFillColor(...LGREY); doc.rect(margin, y, labelW, rowH, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(80,70,68);
      doc.text(fitOneLine(l1, labelW-10), margin+6, y+13);
      doc.rect(margin+labelW, y, valW, rowH, 'D');
      doc.setFont('helvetica','normal'); doc.setFontSize(8.7); doc.setTextColor(20,20,20);
      doc.text(fitOneLine(v1, valW-10), margin+labelW+6, y+13);
      if(l2!==undefined){
        const x2 = margin+labelW+valW;
        doc.setFillColor(...LGREY); doc.rect(x2, y, labelW, rowH, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(80,70,68);
        doc.text(fitOneLine(l2, labelW-10), x2+6, y+13);
        const x3 = x2+labelW;
        doc.rect(x3, y, valW, rowH, 'D');
        doc.setFont('helvetica','normal'); doc.setFontSize(8.7); doc.setTextColor(20,20,20);
        doc.text(fitOneLine(v2, valW-10), x3+6, y+13);
      }
      y += rowH;
    });
  }
  function textRow(label, text){
    const labelW = 108, valW = pw-2*margin-labelW;
    const lines = doc.splitTextToSize(text || 'None recorded.', valW-10);
    const rowH = Math.max(20, lines.length*10.5+9);
    checkPage(rowH);
    doc.setDrawColor(...BORDER);
    doc.setFillColor(...LGREY); doc.rect(margin, y, labelW, rowH, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(80,70,68);
    doc.text(label, margin+6, y+12);
    doc.rect(margin+labelW, y, valW, rowH, 'D');
    doc.setFont('helvetica','normal'); doc.setFontSize(8.7); doc.setTextColor(20,20,20);
    doc.text(lines, margin+labelW+6, y+12);
    y += rowH;
  }

  // ---- Header ----
  doc.addImage(ECC_LOGO_BASE64, 'PNG', pw/2-120, y, 240, 51.7);
  const headerTextY = y + 51.7 + 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,30,30);
  doc.text('P.O. Box 256, Kingdom of Bahrain', pw/2, headerTextY, {align:'center'});
  doc.text('Tel: +973 1616 1600  ·  Email: info@sgbworld.com', pw/2, headerTextY+11, {align:'center'});
  const ruleY = headerTextY + 21;
  doc.setDrawColor(...MAROON); doc.setLineWidth(1.1);
  doc.line(margin, ruleY, pw-margin, ruleY);
  doc.setLineWidth(0.5);
  y = ruleY + 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...MAROON);
  doc.text('LIFT MAINTENANCE SERVICE REPORT', pw/2, y, {align:'center'});
  y += 15;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60,60,60);
  doc.text('Service Job No: ' + (j.jobId||'—') + ' — ' + (j.liftId||'—'), pw/2, y, {align:'center'});
  y += 16;

  // ---- Job information ----
  sectionBar('JOB INFORMATION');
  fieldGrid([
    ['DATE', fmtDate(j.date), 'LIFT ID', j.liftId],
    ['CUSTOMER', j.customerName, 'SITE', siteName(lift.siteId)],
    ['TECHNICIAN', j.technician, 'JOB TYPE', j.type],
    ['PRIORITY', j.priority||'Medium', 'STATUS', j.status]
  ]);

  // ---- Service details ----
  sectionBar('SERVICE DETAILS');
  const serviceDetailRows = [
    ['TIME IN', j.timeIn||'—', 'TIME OUT', j.timeOut||'—'],
    ['DURATION', durationText(j.timeIn,j.timeOut)||'—', 'STATUS ON ARRIVAL', j.arrivalStatus||'—'],
    ['NEXT SERVICE DUE', cust && nextServiceDueApprox(cust) ? fmtDate(nextServiceDueApprox(cust).toISOString().slice(0,10)) : '—', 'MAINTENANCE FREQUENCY', cust ? cust.maintenanceFrequency : '—']
  ];
  if(j.paymentMethod === 'Not applicable'){
    serviceDetailRows.push(['FINAL STATUS', j.finalStatus||'—']);
  } else {
    serviceDetailRows.push(['FINAL STATUS', j.finalStatus||'—', 'CHARGE (BD)', j.charge||'—']);
  }
  fieldGrid(serviceDetailRows);

  textRow('REASON FOR FAULT', j.breakdownReason);
  textRow('RECTIFICATION', j.rectification);
  if(j.notes) textRow('GENERAL NOTES', j.notes);
  y += 6;

  // ---- Parts used ----
  if(j.parts && j.parts.length){
    sectionBar('PARTS USED');
    const cols = [ {h:'Part No.', w:90}, {h:'Description', w:pw-2*margin-90-60-70}, {h:'Qty', w:60}, {h:'Photo', w:70} ];
    checkPage(18);
    let cx = margin;
    doc.setFillColor(...LGREY); doc.rect(margin, y, pw-2*margin, 16, 'F');
    doc.setDrawColor(...BORDER); doc.rect(margin, y, pw-2*margin, 16, 'D');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(80,70,68);
    cols.forEach(c=>{ doc.text(c.h, cx+5, y+11); cx += c.w; });
    y += 16;
    j.parts.forEach(p=>{
      const photo = p.photoId ? j.photos.find(ph=>ph.id===p.photoId) : null;
      const rowH = photo ? 40 : 15;
      checkPage(rowH);
      cx = margin;
      doc.rect(margin, y, pw-2*margin, rowH, 'D');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(20,20,20);
      doc.text(p.no||'—', cx+5, y+10.5); cx += cols[0].w;
      doc.text(p.desc||'—', cx+5, y+10.5, {maxWidth:cols[1].w-8}); cx += cols[1].w;
      doc.text(String(p.qty||'1'), cx+5, y+10.5); cx += cols[2].w;
      if(photo){ try{ doc.addImage(photo.data, 'JPEG', cx+4, y+3, 56, 34); }catch(e){} }
      y += rowH;
    });
    y += 10;
  }

  // ---- Photos ----
  if(j.photos.length){
    sectionBar('SERVICE PHOTOS');
    y += 8;
    const pw_img = 110, ph_img = 82, gap = 10;
    let x = margin;
    j.photos.forEach((p)=>{
      if(x + pw_img > pw-margin){ x = margin; y += ph_img + 18; }
      checkPage(ph_img + 18);
      if(x===margin && y===40) {} // no-op guard
      try{ doc.addImage(p.data, 'JPEG', x, y, pw_img, ph_img); }catch(e){}
      doc.setFontSize(6.5); doc.setTextColor(90,90,90);
      doc.text((p.caption||'').slice(0,28), x, y+ph_img+9);
      x += pw_img + gap;
    });
    y += ph_img + 22;
  }

  // ---- Checklist (kept in our own grouped-by-section layout) ----
  sectionBar('MAINTENANCE CHECKLIST');
  y += 10;
  const sections = Object.entries(CHECKLIST_SECTIONS);
  const secColW = (pw-2*margin-20)/3;
  let sectionStartY = y;
  let maxYUsed = y;
  sections.forEach(([sec, items], si)=>{
    let sy = sectionStartY;
    const sx = margin + si*(secColW+10);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...MAROON);
    doc.text(sec.toUpperCase(), sx, sy); sy += 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.3); doc.setTextColor(30,30,30);
    items.forEach((label, idx)=>{
      const it = j.checklist[sec][idx];
      const tag = it.status ? '['+it.status+'] ' : '[ ] ';
      doc.text(tag + label, sx, sy, {maxWidth: secColW});
      sy += 9.3;
      if(it.status==='Attention' && it.issue){
        doc.setTextColor(180,40,40);
        const lines = doc.splitTextToSize('  - ' + it.issue, secColW);
        doc.text(lines, sx, sy);
        sy += lines.length*8.5;
        doc.setTextColor(30,30,30);
      }
    });
    maxYUsed = Math.max(maxYUsed, sy);
  });
  y = maxYUsed + 16;

  // ---- Customer acceptance & signatures ----
  checkPage(90);
  sectionBar('CUSTOMER ACCEPTANCE & SIGNATURES');
  fieldGrid([
    ['REPRESENTATIVE', j.sig.custName||'—', 'FINAL STATUS', j.finalStatus||'—']
  ]);
  y += 6;
  const sigW = (pw-2*margin-20)/2;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(80,70,68);
  doc.text('CUSTOMER SIGNATURE', margin, y);
  doc.text('TECHNICIAN SIGNATURE', margin+sigW+20, y);
  y += 10;
  doc.setDrawColor(...BORDER);
  doc.rect(margin, y, sigW, 46, 'D');
  doc.rect(margin+sigW+20, y, sigW, 46, 'D');
  if(j.sig.cust){ try{ doc.addImage(j.sig.cust, 'PNG', margin+4, y+3, sigW*0.6, 40); }catch(e){} }
  if(j.sig.tech){ try{ doc.addImage(j.sig.tech, 'PNG', margin+sigW+24, y+3, sigW*0.6, 40); }catch(e){} }
  y += 54;

  // ---- Report / communication status ----
  sectionBar('REPORT / COMMUNICATION STATUS');
  fieldGrid([
    ['JOB STATUS', j.status, 'WHATSAPP STATUS', j.whatsappStatus||'Pending']
  ]);

  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(140,140,140);
  doc.text('Emirates Contracting  |  Lift Maintenance Service Report', pw/2, 812, {align:'center'});

  return doc;
}

/* ---------- BACK OFFICE DASHBOARD ---------- */
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const jobs = DB.jobs;
  const completed = jobs.filter(j=>['Completed','Report Generated','Customer Acknowledged'].includes(j.status));
  const pending = jobs.filter(j=>j.status==='Open');
  const inprog = jobs.filter(j=>j.status==='In Progress');
  const now = new Date();
  const thisMonth = jobs.filter(j=>{ const d=new Date(j.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); });

  const upcoming = DB.customers.map(c=>{
    const due = nextServiceDueApprox(c);
    if(!due) return null;
    const du = daysUntil(due);
    return { c, due, du };
  }).filter(x=>x && x.du>=0 && x.du<=7).sort((a,b)=>a.du-b.du);

  const upcomingHtml = upcoming.length ? upcoming.map(({c,due,du})=>{
    const lifts = DB.lifts.filter(l=>l.customerId===c.id).map(l=>l.id).join(', ') || 'No lifts linked';
    return `<div class="row-card" style="padding:10px 12px;margin-bottom:6px;">
      <div class="row-top">
        <div>
          <div class="row-title" style="font-size:13px;">${esc(c.name)}</div>
          <div class="row-id">${esc(lifts)}</div>
        </div>
        <span class="badge ${du===0?'inactive':(du<=2?'pending':'active')}">${du===0?'Due today':'in '+du+' day'+(du===1?'':'s')}</span>
      </div>
      <div class="row-meta">${fmtDate(due)} · ${esc(c.maintenanceFrequency||'')}</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <select onchange="assignTechnician('${esc(c.id)}', this.value)" style="width:auto;font-size:12px;padding:5px 8px;">
          <option value="">Assign technician…</option>
          ${DB.technicians.map(t=>`<option value="${esc(t.name)}" ${c.assignedTechnician===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}
        </select>
        ${c.assignedTechnician ? `<span class="legend" style="margin:0;">Assigned to ${esc(c.assignedTechnician)}</span>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="empty">Nothing due in the next 7 days.</div>';

  el.innerHTML = `
    <div class="section-head"><h1>Back office dashboard</h1><span class="count">All lifts, all technicians</span></div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>Upcoming this week</h2>
      <div class="desc">Customers whose service window falls in the next 7 days, based on their maintenance frequency.</div>
      ${upcomingHtml}
    </div>

    <div class="stat-grid">
      <div class="stat-card" style="cursor:pointer;" onclick="switchView('lifts')"><div class="num">${DB.lifts.length}</div><div class="lbl">Lifts registered</div></div>
      <div class="stat-card" style="cursor:pointer;" onclick="window._jobFilter=null; switchView('jobs')"><div class="num">${jobs.length}</div><div class="lbl">Total jobs</div></div>
      <div class="stat-card" style="cursor:pointer;" onclick="filterJobsByStatusGroup('Open', ['Open','In Progress'])"><div class="num">${pending.length+inprog.length}</div><div class="lbl">Open jobs</div></div>
      <div class="stat-card" style="cursor:pointer;" onclick="filterJobsByStatusGroup('Completed', ['Completed','Report Generated','Customer Acknowledged'])"><div class="num">${completed.length}</div><div class="lbl">Completed</div></div>
      <div class="stat-card" style="cursor:pointer;" onclick="filterJobsThisMonth()"><div class="num">${thisMonth.length}</div><div class="lbl">Jobs this month</div></div>
    </div>
    <div class="search-row">
      <input id="dashSearch" type="text" placeholder="Search by lift, customer, technician, job ID" oninput="renderDashboardList()">
      <select id="dashStatus" onchange="renderDashboardList()">
        <option value="">All statuses</option>
        ${STATUS_STAGES.map(s=>`<option>${s}</option>`).join('')}
      </select>
    </div>
    <div id="dashList"></div>

    <div class="panel" style="margin-top:18px;">
      <h2>Job numbering</h2>
      <div class="desc">Job IDs and job card numbers auto-generate as JOB-XXX / JC-XXX from this counter. Reset it once trial jobs are done so real numbering starts clean.</div>
      <div class="legend" style="margin-bottom:10px;">Next job will be: <strong>JOB-${String((DB.counters.job||0)+1).padStart(3,'0')}</strong></div>
      <button class="btn secondary" onclick="resetJobCounter()">Reset job numbering</button>
    </div>

    <div class="panel" style="margin-top:18px;">
      <h2>Scanning</h2>
      <div class="desc">When off, technicians must scan the QR code and can't pick a lift manually — reduces mistakes from opening the wrong job. Turn it back on temporarily if a technician reports a scanning problem.</div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:6px;">
        <input type="checkbox" id="manualToggle" ${DB.allowManualLiftOpen!==false?'checked':''} onchange="toggleManualLiftOpen(this.checked)" style="width:16px;height:16px;">
        <span style="font-size:13px;">Allow technicians to open a lift manually (without scanning)</span>
      </label>
    </div>

    <div class="panel" style="margin-top:18px;">
      <h2>Team &amp; login PINs</h2>
      <div class="desc">Names here appear on the login screen. PIN is optional — it's a courtesy check, not real security, since this app has no server. Leave blank for no PIN.</div>
      <div id="teamList"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input id="newTechName" type="text" placeholder="New technician name" style="flex:2;">
        <button class="btn secondary" onclick="addTeamMember()">Add</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--ink-soft);">
        Back office login PIN: <a href="#" onclick="setOfficePin();return false;" style="color:var(--steel);">${DB.officePin ? 'Change' : 'Set'}</a>
      </div>
    </div>
  `;
  renderDashboardList();
  renderTeamList();
}
function toggleManualLiftOpen(val){
  DB.allowManualLiftOpen = val;
  saveDB();
  toast(val ? 'Manual lift entry enabled' : 'Manual lift entry disabled — technicians must scan');
}
function assignTechnician(customerId, techName){
  const c = DB.customers.find(x=>x.id===customerId);
  if(!c) return;
  c.assignedTechnician = techName;
  saveDB();
  renderDashboard();
  toast(techName ? 'Assigned to ' + techName : 'Assignment cleared');
}
function resetJobCounter(){
  const current = DB.counters.job || 0;
  const input = prompt('Next job will be numbered starting from this value + 1.\nEnter 0 to make the next job JOB-001 (recommended once trial jobs are done):', '0');
  if(input===null) return;
  const n = parseInt(input, 10);
  if(isNaN(n) || n < 0){ toast('Enter a valid number (0 or higher)'); return; }
  DB.counters.job = n;
  saveDB();
  toast('Job numbering reset — next job will be JOB-' + String(n+1).padStart(3,'0'));
  renderDashboard();
}
function renderTeamList(){
  const el = document.getElementById('teamList');
  if(!el) return;
  const rows = (DB.technicians||[]).map((t,i)=>`
    <div class="row-card" style="padding:10px 12px;margin-bottom:6px;">
      <div class="row-top">
        <div class="row-title" style="font-size:13px;">${esc(t.name)}${t.pin ? ' <span class="row-id" style="display:inline;">· PIN set</span>' : ''}</div>
        <div style="display:flex;gap:6px;">
          <button class="btn secondary" style="padding:4px 10px;font-size:11px;" onclick="setTechPin(${i})">${t.pin ? 'Change PIN' : 'Set PIN'}</button>
          <button class="btn danger" style="padding:4px 10px;font-size:11px;" onclick="removeTech(${i})">Remove</button>
        </div>
      </div>
    </div>`).join('');
  el.innerHTML = rows || '<div class="empty">No technicians added yet.</div>';
}
function addTeamMember(){
  const inp = document.getElementById('newTechName');
  const name = inp.value.trim();
  if(!name) return;
  DB.technicians = DB.technicians || [];
  if(DB.technicians.some(t=>t.name.toLowerCase()===name.toLowerCase())){ toast('Already in the list'); return; }
  DB.technicians.push({name, pin:''});
  saveDB();
  syncMetaToSheet();
  inp.value = '';
  renderTeamList();
  toast('Added ' + name);
}
function setTechPin(i){
  const t = DB.technicians[i];
  const pin = prompt('Set a PIN for ' + t.name + ' (leave blank to remove PIN):', t.pin||'');
  if(pin===null) return;
  t.pin = pin.trim();
  saveDB();
  renderTeamList();
}
function removeTech(i){
  const t = DB.technicians[i];
  if(!confirm('Remove ' + t.name + ' from the login list?')) return;
  DB.technicians.splice(i,1);
  saveDB();
  syncMetaToSheet();
  renderTeamList();
}
function setOfficePin(){
  const pin = prompt('Set a PIN for Back Office login (leave blank for none):', DB.officePin||'');
  if(pin===null) return;
  DB.officePin = pin.trim();
  saveDB();
  renderDashboard();
}
function renderDashboardList(){
  const q = (document.getElementById('dashSearch').value || '').toLowerCase();
  const status = document.getElementById('dashStatus').value;
  let list = [...DB.jobs].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(status) list = list.filter(j=>j.status===status);
  if(q) list = list.filter(j => [j.jobId,j.liftId,j.customerName,j.technician,j.jobCardNo].join(' ').toLowerCase().includes(q));
  const html = list.map(j=>`
    <div class="row-card">
      <div class="row-top" onclick="openFromDashboard('${esc(j.jobId)}')" style="cursor:pointer;">
        <div><div class="row-title">${esc(j.jobId)} — ${esc(j.liftId)}</div><div class="row-id">${esc(j.customerName||'No customer name')} · Tech: ${esc(j.technician||'—')}${j.priority&&j.priority!=='Medium'?' · '+esc(j.priority)+' priority':''}</div></div>
        <span class="badge ${j.status.toLowerCase().replace(' ','')}">${esc(j.status)}</span>
      </div>
      <div class="row-meta" onclick="openFromDashboard('${esc(j.jobId)}')" style="cursor:pointer;">${fmtDate(j.date)} · ${esc(j.type)}${durationText(j.timeIn,j.timeOut)?' · '+durationText(j.timeIn,j.timeOut):''} ${['Report Generated','Customer Acknowledged'].includes(j.status) ? '· report available' : ''}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        ${j.status==='Report Generated' && j.whatsappStatus==='Sent' ? `<button class="btn secondary" style="padding:6px 12px;font-size:12px;" onclick="event.stopPropagation();markAcknowledged('${esc(j.jobId)}')">Mark customer acknowledged</button>` : ''}
        <button class="btn danger" style="padding:6px 12px;font-size:12px;" onclick="event.stopPropagation();deleteJob('${esc(j.jobId)}')">Delete job</button>
      </div>
    </div>`).join('');
  document.getElementById('dashList').innerHTML = html || '<div class="empty"><div class="big">No jobs match</div>Try a different search or status.</div>';
}
function markAcknowledged(jobId){
  const j = DB.jobs.find(x=>x.jobId===jobId);
  if(!j) return;
  j.status = 'Customer Acknowledged';
  saveDB(j);
  renderDashboardList();
  toast('Marked as customer acknowledged');
}
function openFromDashboard(jobId){ openJob(jobId); }
async function deleteJob(jobId){
  const ok = confirm('This action is not recoverable. Do you really want to delete this job record (' + jobId + ')? All its checklist, photo, and signature data will be permanently lost.');
  if(!ok) return;
  DB.jobs = DB.jobs.filter(j=>j.jobId!==jobId);
  if(FB_READY){
    try{
      await fbDb.collection('jobs').doc(jobId).delete();
      const photosSnap = await fbDb.collection('jobs').doc(jobId).collection('photos').get();
      const batch = fbDb.batch();
      photosSnap.docs.forEach(d=>batch.delete(d.ref));
      if(photosSnap.docs.length) await batch.commit();
    }catch(e){
      toast('Could not delete online — check connection and try again.');
      return;
    }
  }else{
    saveDB();
  }
  renderDashboardList();
  toast('Job ' + jobId + ' deleted');
}

/* ---------- init ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
(async function init(){
  if(FB_READY){
    seedDB(); // temporary defaults, replaced instantly once the first cloud snapshot arrives
    initCloudSync();
  } else {
    await loadDB();
  }
  const saved = await getRememberedUser();
  const stillValid = saved && saved.name && (saved.role==='office' || (DB.technicians||[]).some(t=>t.name===saved.name));
  if(stillValid){
    completeLogin(saved.name, saved.role);
  }else{
    renderLoginScreen();
  }
})();
</script>
</body>
</html>
